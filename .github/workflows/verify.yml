name: Verify Picture Book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picture-book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: runner.os == 'Windows'
        run: node node_modules/electron/install.js
      - run: pnpm check
      - if: always()
        shell: bash
        run: |
          mkdir -p reports
          pnpm audit --json > reports/dependency-audit.raw.json
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - run: pnpm test:browser
      - if: runner.os == 'Windows'
        run: pnpm package:release
      - if: runner.os == 'Windows'
        run: python scripts/unpack-release.py --out ../picture-book-release-consumer
      - if: runner.os == 'Windows'
        working-directory: ../picture-book-release-consumer/source
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: runner.os == 'Windows'
        working-directory: ../picture-book-release-consumer/source
        run: pnpm check
      - if: runner.os == 'Windows'
        working-directory: ../picture-book-release-consumer/source
        env:
          PICTURE_BOOK_TEST_CHROME: ""
        run: pnpm test:browser
      - if: runner.os == 'Windows'
        working-directory: ../picture-book-release-consumer/source
        env:
          PICTURE_BOOK_TEST_DESKTOP: ${{ runner.workspace }}/picture-book-release-consumer/windows/Picture Book.exe
          PICTURE_BOOK_TEST_APP: ${{ runner.workspace }}/picture-book-release-consumer/windows/resources/app
        run: pnpm test:desktop
      - if: runner.os == 'Windows'
        name: Download verified prior Windows release
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'picture-book-1.0.1-windows-x64.zip'
          Invoke-WebRequest 'https://github.com/agammann/picture-book/releases/download/v1.0.1/picture-book_1.0.1_windows-x64.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne '425c4fffd392218858b34f0d60fc4d53726b45ed74164aef0b5a6ed869e651a7') { throw 'Prior release checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'picture-book-prior')
      - if: runner.os == 'Windows'
        name: Verify desktop profile upgrade
        env:
          PICTURE_BOOK_PRIOR_ROOT: ${{ runner.temp }}/picture-book-prior
          PICTURE_BOOK_TEST_DESKTOP: ${{ runner.workspace }}/picture-book-release-consumer/windows/Picture Book.exe
        run: node scripts/test-desktop-upgrade.mjs
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picture-book-release
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ runner.os }}
          path: |
            test-results/
            reports/dependency-audit.raw.json
            ${{ runner.workspace }}/picture-book-release-consumer/source/test-results/
          retention-days: 7
          overwrite: true
  artifact-transfer:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download release artifacts (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download release artifacts (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-release
          path: release-artifacts
      - name: Verify transferred checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS
      - name: Exercise release guard with in-memory clients
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { verifyActionCompatibility } = await import(process.env.GITHUB_WORKSPACE + '/scripts/test-action-compat.mjs');
            await verifyActionCompatibility();
  artifact-missing-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-nonexistent-transfer-guard
      - name: Reject an unexpected missing-artifact result
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    needs: [verify, artifact-transfer, artifact-missing-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download release artifacts (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download release artifacts (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download release artifacts (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picture-book-release
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });
